<title>لوحة إدارة LevelUp بالعربي</title>

<!-- ============================================================
  خطوات لازمة قبل التشغيل:

  1) نفس FIREBASE_CONFIG المستخدم في index.html بالظبط (متظبط تحت بالفعل).

  2) فعّل Email/Password بس (من غير Email Link):
     console.firebase.google.com → مشروعك
     → Authentication > Sign-in method > Email/Password → فعّله
     (سيب "Email link (passwordless sign-in)" مقفول، مش محتاجينه في النسخة دي)

  3) اعمل أول Admin يدويًا:
     Firebase Console > Authentication > Add user (إيميل حقيقي + باسورد)
     → انسخ الـ UID → Firestore > أنشئ collection "admins" → Document ID = الـ UID
     (أي محتوى بسيط جوه الـ Document، مش لازم حقول معينة)

  4) قواعد Firestore (مهم جدًا — الحماية الحقيقية هنا مش في الصفحة):
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         function isAdmin(){
           return request.auth != null &&
             exists(/databases/$(database)/documents/admins/$(request.auth.uid));
         }
         match /admins/{uid} {
           allow read: if request.auth != null && request.auth.uid == uid;
           allow write: if false; // يضاف الأدمن يدويًا من الكونسول بس
         }
         match /students/{id} {
           allow read, write: if isAdmin() || (request.auth != null && request.auth.uid == id);
         }
         match /tasks/{id} {
           allow read, write: if isAdmin() ||
             (request.auth != null && request.auth.uid == resource.data.studentId);
           allow create: if request.auth != null && request.auth.uid == request.resource.data.studentId;
         }
         match /sessions/{id} { /* نفس منطق tasks */ allow read, write: if isAdmin() || (request.auth!=null && request.auth.uid==resource.data.studentId); allow create: if request.auth!=null && request.auth.uid==request.resource.data.studentId; }
         match /notifications/{id} { allow read: if isAdmin() || (request.auth!=null && request.auth.uid==resource.data.studentId); allow update: if isAdmin() || (request.auth!=null && request.auth.uid==resource.data.studentId); allow create: if isAdmin() || (request.auth!=null && request.auth.uid==request.resource.data.studentId); }
         match /activity/{id} { allow read: if isAdmin(); allow create: if request.auth != null; }
         match /adminLog/{id} { allow read, write: if isAdmin(); }
       }
     }
     (النسخة دي مبدئية للتوجيه — راجعها وعدّلها حسب احتياجك الفعلي قبل النشر)

  5) إعداد App Check (reCAPTCHA Enterprise) — طبقة الحماية الثانية بدل Email Link:
     أ) Google Cloud Console → reCAPTCHA Enterprise → أنشئ مفتاح جديد نوعه "Website"،
        وحط فيه الدومين اللي هترفع عليه الصفحة (مثلاً levelup-arabi.github.io).
        سيب خيار "Use checkbox challenge" غير مفعّل (عشان يفضل invisible/score-based).
     ب) Firebase Console → Build → App Check → سجّل تطبيق الويب بتاعك واختار
        reCAPTCHA Enterprise، وحط نفس الـ site key اللي عملته فوق.
     ج) ارجع هنا وحط نفس الـ site key في المتغير APPCHECK_SITE_KEY تحت في الكود.
     د) **متفعّلش Enforcement في App Check دلوقتي.** سيبه في وضع المراقبة (Monitor)
        كام يوم عشان تتأكد إن الموقع شغال طبيعي، وبعدين فعّل Enforcement من
        Firebase Console → App Check → APIs (Firestore/Auth) → Enforce.
     هـ) للتجربة على localhost قبل ما تضيف الدومين الحقيقي، الكود تحت بيفعّل
        Debug Token تلقائيًا على localhost/127.0.0.1 عشان ميرفضكش وانت بتظبط.

  6) طريقة الدخول الجديدة (من غير Email Link):
     إيميل + باسورد → Firebase Auth → فحص admins/{uid} → لو موجود، تدخل
     اللوحة على طول. الحماية بقت في: (أ) قواعد Firestore، (ب) App Check
     بعد تفعيل الـ Enforcement.

  7) الصفحة دي (admin.html) منفصلة عن index.html، ورابطها ميتحطش في أي
     مكان ظاهر للطلاب. وتسجيل الطلاب بجوجل في index.html مش بيتأثر خالص،
     لأنه Authentication منفصل تمامًا وقواعد Firestore هي اللي بتفصل الصلاحيات.
============================================================ -->

<style>
  :root{
    --bg:#f5faf8; --panel:#ffffff; --line:#e2ede9;
    --primary:#1fa77e; --primary-2:#2fb0c4; --mint:#1fa77e; --amber:#f59e0b; --red:#ef4444;
    --text:#152420; --muted:#7d8f8a;
    --shadow: 0 1px 3px rgba(15,35,29,.06), 0 8px 24px rgba(15,35,29,.06);
    --focus: 0 0 0 3px rgba(31,167,126,.28);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 60px;}
  button:focus-visible, input:focus-visible{outline:none;box-shadow:var(--focus);}
  .topbar{position:sticky;top:0;background:rgba(245,250,248,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10;}
  .topbar-inner{max-width:760px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:var(--shadow);}
  h1{font-size:24px;font-weight:800;} h2{font-size:18px;font-weight:800;}
  .muted{color:var(--muted);}
  .center{text-align:center;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn-primary{background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;font-weight:700;border-radius:12px;padding:10px 16px;}
  .btn-danger{background:var(--red);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;}
  .btn-green{background:var(--mint);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;}
  .btn-amber{background:var(--amber);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;}
  .link{color:var(--muted);font-size:13px;background:none;font-weight:600;}
  input{width:100%;background:#fbfdfc;border:1.5px solid var(--line);border-radius:12px;color:var(--text);
    padding:10px 13px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;}
  input:focus{border-color:var(--primary);background:#fff;box-shadow:var(--focus);}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;}
  .field{margin-bottom:13px;}
  .row{display:flex;gap:8px;}
  .list-item{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:16px;padding:14px;margin-bottom:10px;}
  .tabs{display:flex;gap:8px;margin:18px 0;overflow-x:auto;}
  .tab{padding:9px 16px;border-radius:999px;font-size:13px;white-space:nowrap;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-weight:600;}
  .tab.active{background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;border-color:transparent;}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;font-weight:700;}
  .pill.active{background:rgba(31,167,126,.12);color:var(--mint);}
  .pill.suspended{background:rgba(245,158,11,.12);color:var(--amber);}
  .hidden{display:none !important;}
  .err-text{color:var(--red);font-size:12px;margin-top:6px;}
  .notice{background:#fff7e6;border:1px solid #fde3ad;border-radius:12px;padding:10px 12px;font-size:11.5px;margin-bottom:14px;color:#92650c;}

  /* ---------- منشئ المناهج (curriculum builder) ---------- */
  .cur-breadcrumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:14px 0 4px;font-size:13px;}
  .cur-crumb{background:none;color:var(--primary);font-weight:700;padding:4px 6px;border-radius:8px;}
  .cur-crumb:hover{background:rgba(31,167,126,.1);}
  .cur-crumb.current{color:var(--text);cursor:default;}
  .cur-crumb.current:hover{background:none;}
  .cur-sep{color:var(--muted);}
  .cur-section-title{font-size:14px;font-weight:800;margin:18px 0 8px;display:flex;align-items:center;gap:6px;}
  .cur-row{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);}
  .cur-row .cur-name{flex:1;font-weight:700;font-size:14px;cursor:pointer;}
  .cur-row .cur-name .cur-sub{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px;}
  .cur-icon-btn{background:#f0f5f3;color:var(--text);border-radius:9px;width:30px;height:30px;min-width:30px;
    display:flex;align-items:center;justify-content:center;font-size:14px;padding:0;}
  .cur-icon-btn:hover{background:var(--line);}
  .cur-icon-btn.danger{color:var(--red);}
  .cur-add-box{display:flex;gap:8px;margin-top:10px;margin-bottom:4px;}
  .cur-add-box input{flex:1;}
  .cur-add-box button{white-space:nowrap;}
  .cur-empty{color:var(--muted);font-size:13px;padding:8px 2px 4px;}
  .cur-group-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);}
  .cur-group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .cur-group-head b{flex:1;font-size:14px;}
  .cur-group-badge{font-size:11px;background:rgba(47,176,196,.12);color:var(--primary-2);border-radius:999px;padding:3px 9px;font-weight:700;}
  .cur-option-row{display:flex;align-items:center;gap:6px;background:#fbfdfc;border:1px solid var(--line);border-radius:10px;
    padding:6px 8px;margin-bottom:6px;font-size:13px;}
  .cur-option-row span{flex:1;}
</style>
</head>
<body>

<div class="topbar"><div class="topbar-inner">
  <div class="brand"><div class="logo">🛡️</div> لوحة إدارة LevelUp بالعربي</div>
  <button id="logoutBtn" class="link hidden">خروج</button>
</div></div>

<div class="wrap">

  <section id="screen-loading">
    <div style="text-align:center;margin:70px auto 0;">
      <div style="font-size:40px;">⏳</div>
      <p class="muted" style="margin-top:12px;">جاري التحقق من الصلاحيات...</p>
    </div>
  </section>

  <section id="screen-login" class="hidden">
    <div style="max-width:340px;margin:60px auto 0;">
      <h2 class="center">دخول الإدارة</h2>
      <div class="field"><label>الإيميل</label><input id="loginEmail"/></div>
      <div class="field"><label>كلمة المرور</label><input id="loginPassword" type="password"
        onkeydown="if(event.key==='Enter')login()"/></div>
      <button class="btn-primary" id="loginBtn" style="width:100%;" onclick="login()">دخول</button>
      <div id="loginErr" class="err-text"></div>
    </div>
  </section>

  <section id="screen-admin" class="hidden">
    <h2 style="margin-top:16px;">👥 لوحة التحكم</h2>
    <div class="tabs">
      <button class="tab active" data-tab="students" onclick="setAdminTab('students')">الطلاب</button>
      <button class="tab" data-tab="curriculum" onclick="setAdminTab('curriculum')">المناهج</button>
      <button class="tab" data-tab="log" onclick="setAdminTab('log')">سجل الإدارة</button>
    </div>
    <div id="adminTab-students"><div id="adminStudentList"></div></div>
    <div id="adminTab-curriculum" class="hidden">
      <div id="curBreadcrumb" class="cur-breadcrumb"></div>
      <div id="curContent"></div>
    </div>
    <div id="adminTab-log" class="hidden"><div id="adminLogList"></div></div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, updateDoc, deleteDoc, collection,
  addDoc, query, where, getDocs, onSnapshot, orderBy, limit, writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  initializeAppCheck, ReCaptchaEnterpriseProvider
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";

/* ====================== لازم يطابق index.html بالظبط ====================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBCJLeAL6qSd_DQ1kZuTGoMuUDxpjchnwU",
  authDomain: "student-system-aba00.firebaseapp.com",
  projectId: "student-system-aba00",
  storageBucket: "student-system-aba00.firebasestorage.app",
  messagingSenderId: "568182555978",
  appId: "1:568182555978:web:4eafcdd4503d3b378e6db3"
};
/* ============================================================================ */

const app = initializeApp(FIREBASE_CONFIG);

/* ====================== App Check (reCAPTCHA Enterprise) ======================
   حط هنا الـ site key اللي عملته في Google Cloud Console > reCAPTCHA Enterprise
   وسجّلته في Firebase Console > App Check. لحد ما تحطه، الكود بيتخطى تفعيل
   App Check تلقائيًا (من غير ما يكسر تسجيل الدخول)، ويطبع تحذير في الـConsole. */
const APPCHECK_SITE_KEY = 'ضع_مفتاح_reCAPTCHA_Enterprise_هنا';

if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  // بيسمحلك تجرب من جهازك قبل ما تضيف الدومين الحقيقي في reCAPTCHA/App Check.
  // بعد أول تشغيل هتلاقي في الـConsole تحذير فيه رابط لتسجيل الـdebug token
  // في Firebase Console > App Check > Manage debug tokens.
  self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
}

if (APPCHECK_SITE_KEY && APPCHECK_SITE_KEY !== 'ضع_مفتاح_reCAPTCHA_Enterprise_هنا') {
  try {
    initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider(APPCHECK_SITE_KEY),
      isTokenAutoRefreshEnabled: true
    });
    console.log('✅ App Check اتفعّل (لسه في وضع المراقبة لحد ما تفعّل Enforcement من الكونسول).');
  } catch (e) {
    console.error('❌ تعذّر تفعيل App Check:', e);
  }
} else {
  console.warn('⚠️ App Check لسه مش متفعّل: حط الـ site key بتاعك في APPCHECK_SITE_KEY في admin.html.');
}

const auth = getAuth(app);
const db = getFirestore(app);

function go(screen){
  document.querySelectorAll('section[id^="screen-"]').forEach(s=>s.classList.add('hidden'));
  document.getElementById('screen-'+screen).classList.remove('hidden');
  document.getElementById('logoutBtn').classList.toggle('hidden', screen!=='admin');
}
document.getElementById('logoutBtn').onclick = ()=> signOut(auth).then(()=>go('login'));
window.go = go;

function toMillis(t){ if(!t) return Date.now(); if(typeof t.toMillis==='function') return t.toMillis(); return t; }
function fmtTime(t){ return new Date(toMillis(t)).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}); }

// ---------------- تسجيل الدخول: إيميل + باسورد فقط ----------------
window.login = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginErr'); errEl.textContent='';
  if(!email || !pw) return;
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  try{
    await signInWithEmailAndPassword(auth, email, pw);
    // onAuthStateChanged هيتكفل بالباقي: فحص admins/{uid} ثم عرض اللوحة أو الرفض
  }catch(err){
    // مؤقتًا بنعرض رسالة الخطأ الحقيقية من Firebase للتشخيص.
    // لما تتأكد إن الدخول بيشتغل تمام، رجّع الرسالة العامة تاني قبل النشر النهائي:
    // errEl.textContent = 'إيميل أو كلمة مرور غلط.';
    errEl.textContent = 'فشل الدخول: ' + err.message + ' (' + err.code + ')';
    console.error('Firebase Auth Error:', err);
  }finally{
    btn.disabled = false;
  }
}

let isAdminLoaded = false; // بيمنع onSnapshot يتفعّل أكتر من مرة لو afterFullVerification اتنادت أكتر من مرة (مثلاً بعد تجديد التوكن)

async function afterFullVerification(user){
  try{
    const adminDoc = await getDoc(doc(db,'admins',user.uid));
    if(!adminDoc.exists()){
      await signOut(auth);
      go('login');
      document.getElementById('loginErr').textContent = 'الحساب ده مش أدمن.';
      return;
    }
    go('admin');
    if(!isAdminLoaded){
      isAdminLoaded = true;
      loadAdminStudents();
      loadAdminLog();
    }
  }catch(err){
    console.error('afterFullVerification error:', err);
    go('login');
  }
}

// ---------------- tabs ----------------
window.setAdminTab = function(tab){
  document.querySelectorAll('#screen-admin .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  ['students','curriculum','log'].forEach(t=> document.getElementById('adminTab-'+t).classList.toggle('hidden', t!==tab));
  if(tab==='curriculum' && !curInited){ curInited = true; renderCurGrades(); }
}

function addAdminLog(action){
  addDoc(collection(db,'adminLog'), {action, time: serverTimestamp()});
}

// ---------------- students ----------------
function loadAdminStudents(){
  onSnapshot(collection(db,'students'), snap=>{
    const wrap = document.getElementById('adminStudentList');
    wrap.textContent = '';
    if(snap.empty){
      const p = document.createElement('p'); p.className='muted'; p.textContent='لا يوجد طلاب بعد.';
      wrap.appendChild(p); return;
    }
    snap.forEach(d=>{
      const s = {id:d.id, ...d.data()};
      wrap.appendChild(buildStudentCard(s));
    });
  });
}

// كل قيمة قادمة من Firestore (اسم، يوزر، مسار) بتتحط كـ textContent فقط،
// والأزرار بتاخد بياناتها عبر closures حقيقية مش عبر تركيب سلاسل onclick="..."،
// عشان نمنع كل من XSS (innerHTML) وحقن جافاسكريبت داخل attribute (onclick).
function buildStudentCard(s){
  const div = document.createElement('div'); div.className='list-item';

  const row1 = document.createElement('div');
  row1.className = 'row'; row1.style.justifyContent='space-between'; row1.style.alignItems='center';
  const info = document.createElement('div');
  const nameB = document.createElement('b'); nameB.textContent = s.name || '';
  const pill = document.createElement('span');
  pill.className = `pill ${s.active===false?'suspended':'active'}`;
  pill.textContent = s.active===false ? 'موقوف' : 'فعال';
  const subDiv = document.createElement('div');
  subDiv.className = 'muted'; subDiv.style.fontSize = '12px';
  subDiv.textContent = `${s.username||''}`;
  info.appendChild(nameB);
  info.appendChild(document.createTextNode(' '));
  info.appendChild(pill);
  info.appendChild(subDiv);
  row1.appendChild(info);
  div.appendChild(row1);

  div.appendChild(buildStudentCurriculumDetail(s));

  const row2 = document.createElement('div'); row2.className='row'; row2.style.marginTop='8px';
  const notifInput = document.createElement('input'); notifInput.placeholder = 'إشعار للطالب...';
  const sendBtn = document.createElement('button'); sendBtn.className='btn-primary'; sendBtn.textContent='إرسال';
  sendBtn.addEventListener('click', ()=> sendNotif(s.id, s.name, notifInput));
  row2.appendChild(notifInput); row2.appendChild(sendBtn);
  div.appendChild(row2);

  const row3 = document.createElement('div'); row3.className='row'; row3.style.marginTop='8px';
  const toggleBtn = document.createElement('button');
  toggleBtn.className='btn-amber'; toggleBtn.style.flex='1';
  toggleBtn.textContent = s.active===false ? 'إعادة تفعيل' : 'تعطيل';
  toggleBtn.addEventListener('click', ()=> toggleActive(s.id, s.name, s.active!==false));
  const delBtn = document.createElement('button');
  delBtn.className='btn-danger'; delBtn.style.flex='1'; delBtn.textContent='حذف نهائي';
  delBtn.addEventListener('click', ()=> hardDeleteStudent(s.id, s.name));
  row3.appendChild(toggleBtn); row3.appendChild(delBtn);
  div.appendChild(row3);

  return div;
}

// عرض تفصيلي للصف/النظام/المسار والمواد المختارة، بدل نص "track" القديم بس.
// بيدعم بيانات الطلاب القدامى (اللي كان عندهم track نصي بس، من غير gradeId/selectedSubjects).
function buildStudentCurriculumDetail(s){
  const box = document.createElement('div');
  box.style.cssText = 'margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);';

  const chipsRow = document.createElement('div');
  chipsRow.style.cssText = 'display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;';
  const mkChip = (text, bg, color)=>{
    const c = document.createElement('span');
    c.style.cssText = `font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:${bg};color:${color};`;
    c.textContent = text;
    return c;
  };
  if(s.gradeName) chipsRow.appendChild(mkChip('📚 '+s.gradeName, 'rgba(31,167,126,.1)', 'var(--mint)'));
  if(s.systemName) chipsRow.appendChild(mkChip('🏫 '+s.systemName, 'rgba(47,176,196,.12)', 'var(--primary-2)'));
  if(s.trackName || s.track) chipsRow.appendChild(mkChip('🛤️ '+(s.trackName||s.track), '#f0f5f3', 'var(--text)'));
  if(!chipsRow.children.length){
    const none = document.createElement('span'); none.className='muted'; none.style.fontSize='12px';
    none.textContent = 'بدون مسار دراسي محدد';
    box.appendChild(none);
    return box;
  }
  box.appendChild(chipsRow);

  const addSubjLine = (label, names)=>{
    if(!names || !names.length) return;
    const line = document.createElement('div');
    line.style.cssText = 'font-size:11.5px;color:var(--muted);margin-top:2px;';
    const b = document.createElement('b'); b.style.color='var(--text)'; b.style.fontWeight='700'; b.textContent = label+': ';
    line.appendChild(b);
    line.appendChild(document.createTextNode(names.join('، ')));
    box.appendChild(line);
  };

  if(s.requiredSubjects && s.requiredSubjects.length){
    addSubjLine('📗 مواد ثابتة', s.requiredSubjects.map(x=>x.name));
  }
  if(s.selectedSubjects && s.selectedSubjects.length){
    s.selectedSubjects.forEach(g=>{
      addSubjLine('🔀 '+g.groupTitle, (g.options||[]).map(x=>x.name));
    });
  }
  if(s.outsideSubjects && s.outsideSubjects.length){
    addSubjLine('📙 خارج المجموع', s.outsideSubjects.map(x=>x.name));
  }
  return box;
}

async function hardDeleteStudent(id,name){
  const sDoc = await getDoc(doc(db,'students',id));
  const typed = prompt(`ده حذف نهائي لبيانات ${name} (المهام، الجلسات، الإشعارات، السجل). اكتب اسم المستخدم بالظبط للتأكيد.`);
  if(!sDoc.exists() || typed !== sDoc.data().username){ if(typed!==null) alert('الاسم مش مطابق، اتلغت العملية.'); return; }
  for(const col of ['tasks','sessions','activity','notifications']){
    const snap = await getDocs(query(collection(db,col), where('studentId','==',id)));
    const batch = writeBatch(db);
    snap.forEach(d=>batch.delete(d.ref));
    if(!snap.empty) await batch.commit();
  }
  await deleteDoc(doc(db,'students',id));
  addAdminLog(`حذف نهائي لحساب: ${name}`);
  alert('اتمسحت بيانات الحساب من قاعدة البيانات. حساب الدخول (Authentication) نفسه لسه محتاج يتشال يدويًا من Firebase Console > Authentication.');

// المسار في Firestore:
//   curriculumGrades/{gradeId}
//     -> systems/{systemId}
//          -> tracks/{trackId}   { name, order,
//                requiredSubjects:[{id,name,order}],
//                choiceGroups:[{id,title,choose,order,options:[{id,name,order}]}],
//                outsideSubjects:[{id,name,order}] }
// الموقع الأمامي بيقرأ نفس المسار بالظبط عشان يعرض فقط اللي الأدمن ضافه.

let curInited = false;

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null)? '' : String(s); }

function curBreadcrumb(){
  const wrap = document.getElementById('curBreadcrumb');
  wrap.textContent='';
  const crumbs = [{label:'الصفوف', fn:()=>{curGrade=null;curSystem=null;curTrack=null;renderCurGrades();}}];
  if(curGrade) crumbs.push({label:curGrade.name, fn:()=>{curSystem=null;curTrack=null;renderCurSystems();}});
  if(curSystem) crumbs.push({label:curSystem.name, fn:()=>{curTrack=null;renderCurTracks();}});
  if(curTrack) crumbs.push({label:curTrack.name, fn:()=>renderCurTrackDetail()});
  crumbs.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'cur-crumb' + (i===crumbs.length-1?' current':'');
    b.textContent = c.label;
    if(i!==crumbs.length-1) b.addEventListener('click', c.fn);
    else b.disabled = true;
    wrap.appendChild(b);
    if(i!==crumbs.length-1){ const sep=document.createElement('span'); sep.className='cur-sep'; sep.textContent=' ‹ '; wrap.appendChild(sep); }
  });
}

// صف عام قابل لإعادة الاستخدام: اسم + أزرار تحديد/تعديل/حذف/تحريك
function buildCurRow({name, sub, onOpen, onEdit, onDelete, onUp, onDown}){
  const row = document.createElement('div'); row.className='cur-row';
  const nameDiv = document.createElement('div'); nameDiv.className='cur-name';
  nameDiv.textContent = name;
  if(sub){ const s=document.createElement('span'); s.className='cur-sub'; s.textContent=sub; nameDiv.appendChild(s); }
  if(onOpen){ nameDiv.addEventListener('click', onOpen); }
  row.appendChild(nameDiv);
  if(onUp){ const b=document.createElement('button'); b.className='cur-icon-btn'; b.textContent='↑'; b.title='تحريك لأعلى'; b.addEventListener('click',(e)=>{e.stopPropagation();onUp();}); row.appendChild(b); }
  if(onDown){ const b=document.createElement('button'); b.className='cur-icon-btn'; b.textContent='↓'; b.title='تحريك لأسفل'; b.addEventListener('click',(e)=>{e.stopPropagation();onDown();}); row.appendChild(b); }
  if(onEdit){ const b=document.createElement('button'); b.className='cur-icon-btn'; b.textContent='✎'; b.title='تعديل'; b.addEventListener('click',(e)=>{e.stopPropagation();onEdit();}); row.appendChild(b); }
  if(onDelete){ const b=document.createElement('button'); b.className='cur-icon-btn danger'; b.textContent='✕'; b.title='حذف'; b.addEventListener('click',(e)=>{e.stopPropagation();onDelete();}); row.appendChild(b); }
  return row;
}

function buildCurAddBox(placeholder, onAdd){
  const box = document.createElement('div'); box.className='cur-add-box';
  const input = document.createElement('input'); input.placeholder = placeholder;
  const btn = document.createElement('button'); btn.className='btn-primary'; btn.textContent='+ إضافة';
  const doAdd = ()=>{ const v=input.value.trim(); if(!v) return; onAdd(v); input.value=''; };
  btn.addEventListener('click', doAdd);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') doAdd(); });
  box.appendChild(input); box.appendChild(btn);
  return box;
}

async function renderCurGrades(){
  curBreadcrumb();
  const wrap = document.getElementById('curContent'); wrap.textContent='';
  const title = document.createElement('div'); title.className='cur-section-title'; title.textContent='📚 الصفوف الدراسية';
  wrap.appendChild(title);
  const snap = await getDocs(query(collection(db,'curriculumGrades'), orderBy('order')));
  const docs = snap.docs;
  if(docs.length===0){ const p=document.createElement('div'); p.className='cur-empty'; p.textContent='لا يوجد صفوف بعد. ضيف أول صف تحت.'; wrap.appendChild(p); }
  docs.forEach((d,i)=>{
    const g = {id:d.id, ...d.data()};
    wrap.appendChild(buildCurRow({
      name: g.name,
      onOpen: ()=>{ curGrade={id:g.id,name:g.name}; curSystem=null; curTrack=null; renderCurSystems(); },
      onEdit: async ()=>{ const nn=prompt('اسم الصف:', g.name); if(nn&&nn.trim()){ await updateDoc(d.ref,{name:nn.trim()}); addAdminLog(`تعديل اسم صف: ${g.name} → ${nn.trim()}`); renderCurGrades(); } },
      onDelete: async ()=>{ if(!confirm(`حذف صف "${g.name}" هيمسح كل الأنظمة والمسارات والمواد اللي جواه. متأكد؟`)) return; await deleteGradeCascade(g.id); addAdminLog(`حذف صف: ${g.name}`); renderCurGrades(); },
      onUp: i>0 ? async ()=>{ await swapOrder(collection(db,'curriculumGrades'), docs, i, i-1); renderCurGrades(); } : null,
      onDown: i<docs.length-1 ? async ()=>{ await swapOrder(collection(db,'curriculumGrades'), docs, i, i+1); renderCurGrades(); } : null,
    }));
  });
  wrap.appendChild(buildCurAddBox('اسم الصف (مثلاً: تانية ثانوي)', async (v)=>{
    await addDoc(collection(db,'curriculumGrades'), {name:v, order:docs.length});
    addAdminLog(`إضافة صف: ${v}`);
    renderCurGrades();
  }));
}

async function openTrack(id, name){
  const ref = doc(db,'curriculumGrades',curGrade.id,'systems',curSystem.id,'tracks',id);
  const d = await getDoc(ref);
  const data = d.data() || {};
  curTrack = {
    id, name,
    requiredSubjects: data.requiredSubjects || [],
    choiceGroups: data.choiceGroups || [],
    outsideSubjects: data.outsideSubjects || [],
  };
  renderCurTrackDetail();
}
function curTrackRef(){ return doc(db,'curriculumGrades',curGrade.id,'systems',curSystem.id,'tracks',curTrack.id); }
async function saveCurTrackField(field){ await updateDoc(curTrackRef(), {[field]: curTrack[field]}); }

// ---------- مستوى 4: تفاصيل المسار (مواد ثابتة / مجموعات اختيار / مواد خارج المجموع) ----------
function renderCurTrackDetail(){
  curBreadcrumb();
  const wrap = document.getElementById('curContent'); wrap.textContent='';

  // 1) المواد الثابتة
  wrap.appendChild(simpleSubjectListSection('📗 المواد الثابتة', 'requiredSubjects',
    'اسم المادة (مثلاً: اللغة العربية)'));

  // 2) مجموعات الاختيار
  const gTitle = document.createElement('div'); gTitle.className='cur-section-title'; gTitle.textContent='🔀 مجموعات الاختيار';
  wrap.appendChild(gTitle);
  const groups = curTrack.choiceGroups.slice().sort((a,b)=>a.order-b.order);
  if(groups.length===0){ const p=document.createElement('div'); p.className='cur-empty'; p.textContent='لا يوجد مجموعات اختيار بعد.'; wrap.appendChild(p); }
  groups.forEach((g,gi)=>{
    const card = document.createElement('div'); card.className='cur-group-card';
    const head = document.createElement('div'); head.className='cur-group-head';
    const b = document.createElement('b'); b.textContent = g.title;
    const badge = document.createElement('span'); badge.className='cur-group-badge'; badge.textContent = `اختر ${g.choose}`;
    head.appendChild(b); head.appendChild(badge);
    const mkBtn=(txt,cls,fn)=>{const bb=document.createElement('button');bb.className='cur-icon-btn'+(cls?' '+cls:'');bb.textContent=txt;bb.addEventListener('click',fn);return bb;};
    if(gi>0) head.appendChild(mkBtn('↑','',()=>{ [groups[gi-1],groups[gi]]=[groups[gi],groups[gi-1]]; groups.forEach((x,idx)=>x.order=idx); curTrack.choiceGroups=groups; saveCurTrackField('choiceGroups').then(renderCurTrackDetail); }));
    if(gi<groups.length-1) head.appendChild(mkBtn('↓','',()=>{ [groups[gi+1],groups[gi]]=[groups[gi],groups[gi+1]]; groups.forEach((x,idx)=>x.order=idx); curTrack.choiceGroups=groups; saveCurTrackField('choiceGroups').then(renderCurTrackDetail); }));
    head.appendChild(mkBtn('✎','',()=>{
      const nt = prompt('عنوان المجموعة:', g.title); if(nt===null) return;
      const nc = prompt('عدد المواد المطلوب اختيارها:', g.choose); if(nc===null) return;
      const num = parseInt(nc,10);
      if(nt.trim()) g.title = nt.trim();
      if(!isNaN(num) && num>0) g.choose = num;
      curTrack.choiceGroups = groups; saveCurTrackField('choiceGroups').then(renderCurTrackDetail);
    }));
    head.appendChild(mkBtn('✕','danger',()=>{
      if(!confirm(`حذف مجموعة "${g.title}" وكل خياراتها؟`)) return;
      curTrack.choiceGroups = groups.filter(x=>x.id!==g.id).map((x,idx)=>({...x,order:idx}));
      saveCurTrackField('choiceGroups').then(renderCurTrackDetail);
    }));
    card.appendChild(head);

    const opts = (g.options||[]).slice().sort((a,b)=>a.order-b.order);
    opts.forEach((o,oi)=>{
      const orow = document.createElement('div'); orow.className='cur-option-row';
      const span = document.createElement('span'); span.textContent = o.name; orow.appendChild(span);
      if(oi>0) orow.appendChild(mkBtn('↑','',()=>{ [opts[oi-1],opts[oi]]=[opts[oi],opts[oi-1]]; opts.forEach((x,idx)=>x.order=idx); g.options=opts; curTrack.choiceGroups=groups; saveCurTrackField('choiceGroups').then(renderCurTrackDetail); }));
      if(oi<opts.length-1) orow.appendChild(mkBtn('↓','',()=>{ [opts[oi+1],opts[oi]]=[opts[oi],opts[oi+1]]; opts.forEach((x,idx)=>x.order=idx); g.options=opts; curTrack.choiceGroups=groups; saveCurTrackField('choiceGroups').then(renderCurTrackDetail); }));
      orow.appendChild(mkBtn('✎','',()=>{ const nn=prompt('اسم المادة:', o.name); if(nn&&nn.trim()){ o.name=nn.trim(); g.options=opts; curTrack.choiceGroups=groups; saveCurTrackField('choiceGroups').then(renderCurTrackDetail); } }));
      orow.appendChild(mkBtn('✕','danger',()=>{ g.options = opts.filter(x=>x.id!==o.id).map((x,idx)=>({...x,order:idx})); curTrack.choiceGroups=groups; saveCurTrackField('choiceGroups').then(renderCurTrackDetail); }));
      card.appendChild(orow);
    });
    card.appendChild(buildCurAddBox('+ إضافة اختيار داخل المجموعة', (v)=>{
      g.options = [...opts, {id:genId(), name:v, order:opts.length}];
      curTrack.choiceGroups = groups;
      saveCurTrackField('choiceGroups').then(renderCurTrackDetail);
    }));
    wrap.appendChild(card);
  });
  // إضافة مجموعة اختيار جديدة
  const addGroupBox = document.createElement('div'); addGroupBox.className='cur-add-box';
  const titleInput = document.createElement('input'); titleInput.placeholder='عنوان المجموعة (مثلاً: اختر مادة واحدة)';
  const countInput = document.createElement('input'); countInput.type='number'; countInput.min='1'; countInput.value='1'; countInput.style.maxWidth='90px';
  const addGroupBtn = document.createElement('button'); addGroupBtn.className='btn-primary'; addGroupBtn.textContent='+ مجموعة';
  addGroupBtn.addEventListener('click', ()=>{
    const t = titleInput.value.trim(); const c = parseInt(countInput.value,10)||1;
    if(!t) return;
    curTrack.choiceGroups = [...curTrack.choiceGroups, {id:genId(), title:t, choose:c, order:curTrack.choiceGroups.length, options:[]}];
    saveCurTrackField('choiceGroups').then(renderCurTrackDetail);
  });
  addGroupBox.appendChild(titleInput); addGroupBox.appendChild(countInput); addGroupBox.appendChild(addGroupBtn);
  wrap.appendChild(addGroupBox);

  // 3) مواد خارج المجموع
  wrap.appendChild(simpleSubjectListSection('📙 مواد خارج المجموع', 'outsideSubjects',
    'اسم المادة (خارج المجموع)'));
}

// قسم قائمة بسيطة (مواد ثابتة / مواد خارج المجموع) بيتعاد استخدامه مرتين
function simpleSubjectListSection(titleText, field, placeholder){
  const box = document.createElement('div');
  const title = document.createElement('div'); title.className='cur-section-title'; title.textContent=titleText;
  box.appendChild(title);
  const items = curTrack[field].slice().sort((a,b)=>a.order-b.order);
  if(items.length===0){ const p=document.createElement('div'); p.className='cur-empty'; p.textContent='لا يوجد مواد بعد.'; box.appendChild(p); }
  items.forEach((it,i)=>{
    box.appendChild(buildCurRow({
      name: it.name,
      onEdit: ()=>{ const nn=prompt('اسم المادة:', it.name); if(nn&&nn.trim()){ it.name=nn.trim(); curTrack[field]=items; saveCurTrackField(field).then(renderCurTrackDetail); } },
      onDelete: ()=>{ curTrack[field] = items.filter(x=>x.id!==it.id).map((x,idx)=>({...x,order:idx})); saveCurTrackField(field).then(renderCurTrackDetail); },
      onUp: i>0 ? ()=>{ [items[i-1],items[i]]=[items[i],items[i-1]]; items.forEach((x,idx)=>x.order=idx); curTrack[field]=items; saveCurTrackField(field).then(renderCurTrackDetail); } : null,
      onDown: i<items.length-1 ? ()=>{ [items[i+1],items[i]]=[items[i],items[i+1]]; items.forEach((x,idx)=>x.order=idx); curTrack[field]=items; saveCurTrackField(field).then(renderCurTrackDetail); } : null,
    }));
  });
  box.appendChild(buildCurAddBox(placeholder, (v)=>{
    curTrack[field] = [...curTrack[field], {id:genId(), name:v, order:items.length}];
    saveCurTrackField(field).then(renderCurTrackDetail);
  }));
  return box;
}

// ---------- أدوات مشتركة: إعادة ترتيب مستندات في كولكشن، وحذف تسلسلي ----------
async function swapOrder(colRef, docsArr, i, j){
  const a = docsArr[i], b = docsArr[j];
  const aOrder = a.data().order ?? i, bOrder = b.data().order ?? j;
  await updateDoc(a.ref, {order: bOrder});
  await updateDoc(b.ref, {order: aOrder});
}
async function deleteSystemCascade(gradeId, systemId){
  const tracksSnap = await getDocs(collection(db,'curriculumGrades',gradeId,'systems',systemId,'tracks'));
  for(const t of tracksSnap.docs) await deleteDoc(t.ref);
  await deleteDoc(doc(db,'curriculumGrades',gradeId,'systems',systemId));
}
async function deleteGradeCascade(gradeId){
  const sysSnap = await getDocs(collection(db,'curriculumGrades',gradeId,'systems'));
  for(const s of sysSnap.docs) await deleteSystemCascade(gradeId, s.id);
  await deleteDoc(doc(db,'curriculumGrades',gradeId));
}

onAuthStateChanged(auth, (user)=>{
  if(!user){ go('login'); return; }
  afterFullVerification(user);
});

go('loading'); // شاشة تحميل فقط لحد ما onAuthStateChanged يقرر الوجهة الصح

</script>
